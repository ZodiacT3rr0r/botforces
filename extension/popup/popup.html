<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotForces Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div class="header">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          <span>Bot<strong>Forces</strong></span>
        </div>
        <span class="version" id="version"></span>
      </div>

      <div class="status-section">
        <div class="status-item">
          <div class="status-dot" id="cf-status-dot"></div>
          <span id="cf-status-text">Checking Codeforces...</span>
        </div>
        <div class="status-item">
          <div class="status-dot" id="app-status-dot"></div>
          <span id="app-status-text">Checking BotForces app...</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="last-result" id="last-result" style="display: none;">
        <div class="result-label">Last Submission</div>
        <div class="result-verdict" id="result-verdict"></div>
        <div class="result-problem" id="result-problem"></div>
      </div>

      <a href="http://localhost:3000" target="_blank" class="open-app-btn">
        Open BotForces Dashboard
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
